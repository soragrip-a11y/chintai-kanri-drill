n-bottom:17px}.q-number{font-size:13px;font-weight:800;color:var(--aqua)}.q-title{font-size:clamp(19px,3.5vw,25px);letter-spacing:-.5px;line-height:1.6;margin-bottom:22px}.answers{display:grid;gap:10px}.choice{width:100%;display:flex;text-align:left;gap:14px;align-items:flex-start;padding:15px;border:1.5px solid var(--line);background:#fff;border-radius:12px;line-height:1.55;font-weight:650}.choice:hover:not(:disabled){border-color:#36947c;background:#f7fcfa}.choice .mark{flex:0 0 28px;width:28px;height:28px;border-radius:8px;background:#f0f5f4;color:#72808a;display:grid;place-items:center;font-size:13px;font-weight:900}.choice.correct{border-color:#2a9975;background:#f1fbf5}.choice.correct .mark{background:#217c5c;color:white}.choice.wrong{border-color:#d47f77;background:#fff5f4}.choice.wrong .mark{background:#bc5e53;color:white}.choice:disabled{cursor:default}.answer-review{margin-top:21px;padding:20px;border-radius:13px;background:#f1f7f4;border:1px solid #d5e7db}.answer-review.is-wrong{background:#fff8f1;border-color:#f4dfc7}.result-label{font-size:14px;font-weight:900;margin-bottom:8px}.source-link{font-size:12px;word-break:break-all;display:inline-flex;gap:4px;margin-top:7px}.q-actions{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:20px}.q-actions button{flex:1}.ghost-action{border:0;background:transparent;font-weight:750;color:var(--aqua);padding:10px}.timeout{background:#fff3e3;border-radius:10px;padding:10px 12px;font-size:12px;color:#7a5619}.summary{max-width:760px;margin:32px auto}.summary-hero{padding:33px;text-align:center;background:var(--navy);color:white;border-radius:22px}.summary-hero h2{font-size:42px;margin:10px}.summary-hero p{color:#d4e7e5}.summary-hero .btn{margin:6px}.recap-list{margin-top:18px}.recap{border-bottom:1px solid var(--line);padding:15px 0}.recap strong{display:block;font-size:13px}.recap small{color:var(--sub)}.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:22px}.sta <script>window.__DRILL_QUESTIONS=[{"id":"K001","category":"登録・業務管理","topic":"登録義務","question":"賃貸住宅管理業の登録義務について、正しいものはどれか。","choices":[{"text":"管理戸数200戸以上の事業者は、原則として国土交通大臣の登録が必要である。","ok":true},{"text":"管理戸数50戸以上で登録が必要となる。","ok":false},{"text":"管理戸数100戸以上で登録が必要となる。","ok":false},{"text":"管理戸数500戸以上になるまで登録は不要である。","ok":false}],"explanation":"登録義務の境界は200戸。管理戸数200戸未満なら任意登録ができる。","source":"https://www.mlit.go.jp/tochi_fudousan_kensetsugyo/pm_portal/administrator_duties.html","sourceName":"国交省：管理業者の業務","basisDate":"2026-04-01","verified":"一次資料確認済み"},{"id":"K002","category":"登録・業務管理","topic":"任意登録","question":"管理戸数150戸の事業者について、正しいものはどれか。","choices":[{"text":"登録を受けても賃貸住宅管理業法の業者規制を受けない。","ok":false},{"text":"法律上の登録は原則任意だが、登録を受けることはできる。","ok":true},{"text":"登録申請自体が禁止される。","ok":false},{"text":"無条件で登録が義務付けられる。","ok":false}],"explanation":"200戸未満は任意登録。ただし登録した業者は該当する法定義務を負う。","source":"https://www.mlit.go.jp/tochi_fudousan_kensetsugyo/pm_portal/system_commentary.html","sourceName":"国交省：制度解説","basisDate":"2026-04-01","verified":"一次資料確認済み"},{"id":"K003","category":"登録・業務管理","topic":"管理業務の定義","question":"家賃の集金だけを受託し、維持保全を行わない事業について正しいものはどれか。","choices":[{"text":"金銭管理だけの場合は例外なく宅建免許が必要となる。","ok":false},{"text":"金銭管理だけでも必ず業務管理者を設置する必要がある。","ok":false},{"text":"家賃等の金銭管理だけでは、法の「賃貸住宅管理業」に該当しない。","ok":true},{"text":"金銭管理だけで当然に管理業登録が必要となる。","ok":false}],"explanation":"法の対象となる管理業務は、維持保全単独、または維持保全と金銭管理の併用。金銭管理のみは対象外。","source":"https://www.mlit.go.jp/tochi_fudousan_kensetsugyo/pm_portal/administrator_duties.html","sourceName":"国交省：管理業者の業務","basisDate":"2026-04-01","verified":"一次資料確認済み"},{"id":"K004","category":"登録・業務管理","topic":"登録先","question":"賃貸住宅管理業の法定登録先として正しいものはどれか。","choices":[{"text":"国土交通大臣。","ok":true},{"text":"都道府県知事。","ok":false},{"text":"市区町村長。","ok":false},{"text":"宅地建物取引業保証協会。","ok":false}],"explanation":"賃貸住宅管理業の法定登録は国土交通大臣に対して行う。","source":"https://www.mlit.go.jp/tochi_fudousan_kensetsugyo/const/tochi_fudousan_kensetsugyo_const_tk3_000001_00012.html","sourceName":"国交省：登録申請","basisDate":"2026-04-01","verified":"一次資料確認済み"},{"id":"K005","category":"登録・業務管理","topic":"登録期間","question":"賃貸住宅管理業の登録の有効期間について正しいものはどれか。","choices":[{"text":"登録後は無期限である。","ok":false},{"text":"5年間である。","ok":true},{"text":"1年間である。","ok":false},{"text":"3年間である。","ok":false}],"explanation":"登録は5年間有効。継続する場合は所定の期間内に更新申請する。","source":"https://www.mlit.go.jp/tochi_fudousan_kensetsugyo/const/tochi_fudousan_kensetsugyo_const_tk3_000001_00012.html","sourceName":"国交省：登録申請","basisDate":"2026-04-01","verified":"一次資料確認済み"},{"id":"K006","category":"登録・業務管理","topic":"更新申請","question":"登録の更新申請時期について正しいものはどれか。","choices":[{"text":"満了日の180日前から150日前までに申請する。","ok":false},{"text":"満了後30日以内であれば必ず適法に更新できる。","ok":false},{"text":"有効期間満了日の90日前から30日前までに申請する。","ok":true},{"text":"満了日の前日だけに申請する。","ok":false}],"explanation":"更新申請は満了日の90日前から30日前まで。","source":"https://www.ktr.mlit.go.jp/kensan/index00000029.html","sourceName":"国交省関東地方整備局：FAQ","basisDate":"2026-04-01","verified":"一次資料確認済み"},{"id":"K007","category":"登録・業務管理","topic":"宅建免許との関係","question":"賃貸住宅管理業の登録と宅建業免許との関係で正しいものはどれか。","choices":[{"text":"宅建業免許がなければ登録申請できない。","ok":false},{"text":"宅建業免許を持つだけで管理業の登録も自動付与される。","ok":false},{"text":"宅建業免許を返納すると管理業登録も必ず同時に消滅する。","ok":false},{"text":"宅建業免許を持っていなくても、要件を満たせば登録を受けられる。","ok":true}],"explanation":"賃貸住宅管理業の登録に宅建業免許の保有は必須ではない。","source":"https://www.ktr.mlit.go.jp/kensan/index00000029.html","sourceName":"国交省関東地方整備局：FAQ","basisDate":"2026-04-01","verified":"一次資料確認済み"},{"id":"K008","category":"登録・業務管理","topic":"業務開始","question":"登録後の事業開始について正しいものはどれか。","choices":[{"text":"登録後1年以内に業務を始めないと、登録取消しの対象となる。","ok":true},{"text":"登録後1か月で開始しなければ自動失効する。","ok":false},{"text":"何年休業しても登録取消しの対象にはならない。","ok":false},{"text":"登録後10年は開業の有無を問わず取消しできない。","ok":false}],"explanation":"1年以内に開始せず、または引き続き1年以上業務を行っていないと認められると、登録取消しの対象。","source":"https://www.ktr.mlit.go.jp/kensan/index00000029.html","sourceName":"国交省関東地方整備局：FAQ","basisDate":"2026-04-01","verified":"一次資料確認済み"},{"id":"K009","category":"登録・業務管理","topic":"業務管理者","question":"業務管理者の配置について正しいものはどれか。","choices":[{"text":"業務管理者は契約ごとに1名選任する。","ok":false},{"text":"営業所または事務所ごとに1名以上配置する。","ok":true},{"text":"会社全体で1名いればすべての営業所に配置不要である。","ok":false},{"text":"管理戸数200戸ごとに必ず1名配置する。","ok":false}],"explanation":"営業所・事務所単位で1名以上。戸数比例の人数要件ではない。","source":"https://www.mlit.go.jp/tochi_fudousan_kensetsugyo/pm_portal/administrator_duties.html","sourceName":"国交省：管理業者の業務","basisDate":"2026-04-01","verified":"一次資料確認済み"},{"id":"K010","category":"登録・業務管理","topic":"兼務","question":"業務管理者について正しいものはどれか。","choices":[{"text":"業務管理者は必ず取締役でなければならない。","ok":false},{"text":"業務管理者は必ず無期雇用の正社員でなければならない。","ok":false},{"text":"適切な管理・監督体制を確保できれば、宅建士等との兼務が法令上当然には禁止されない。","ok":true},{"text":"法律上、業務管理者はすべての副業を禁止される。","ok":false}],"explanation":"兼務自体は禁止ではないが、管理業務の指導・監督に従事できる必要がある。","source":"https://www.ktr.mlit.go.jp/kensan/index00000029.html","sourceName":"国交省関東地方整備局：FAQ","basisDate":"2026-04-01","verified":"一次資料確認済み"},{"id":"K011","category":"登録・業務管理","topic":"重要事項説明","question":"管理受託契約の締結前に必要な対応として正しいものはどれか。","choices":[{"text":"契約後に口頭報告するだけで足りる。","ok":false},{"text":"重要事項説明は入居者にだけ行う。","ok":false},{"text":"管理報酬の説明は法律上禁止されている。","ok":false},{"text":"管理内容や報酬等について書面を交付して説明する。","ok":true}],"explanation":"管理受託契約の相手方となるオーナーに対し、締結前に書面交付・説明を行う。","source":"https://www.mlit.go.jp/tochi_fudousan_kensetsugyo/pm_portal/administrator_duties.html","sourceName":"国交省：管理業者の業務","basisDate":"2026-04-01","verified":"一次資料確認済み"},{"id":"K012","category":"登録・業務管理","topic":"説明者","question":"管理受託契約の重要事項を説明する者について正しいものはどれか。","choices":[{"text":"法律上、説明者は必ずしも業務管理者本人である必要はない。","ok":true},{"text":"必ず行政書士が行う。","ok":false},{"text":"必ず賃貸人自身が説明する。","ok":false},{"text":"必ず業務管理者だけが行い、他の従業員は一切できない。","ok":false}],"explanation":"業務管理者等の知識・経験ある者が説明することを推奨するが、説明者を業務管理者に限定していない。","source":"https://www.mlit.go.jp/tochi_fudousan_kensetsugyo/pm_portal/faq.html","sourceName":"国交省：FAQ","basisDate":"2026-04-01","verified":"一次資料確認済み"},{"id":"K013","category":"登録・業務管理","topic":"説明から締結","question":"管理受託契約の説明と締結の間隔について正しいものはどれか。","choices":[{"text":"説明から締結までは必ず1年以上あける。","ok":false},{"text":"国交省は説明から契約まで1週間程度あけることを推奨している。","ok":true},{"text":"法律で必ず30日以上あけなければならない。","ok":false},{"text":"法律上、説明した瞬間に締結しなければならない。","ok":false}],"explanation":"1週間程度は推奨であり、すべての契約で法律上の絶対的な待機期間というわけではない。","source":"https://www.mlit.go.jp/tochi_fudousan_kensetsugyo/pm_portal/faq.html","sourceName":"国交省：FAQ","basisDate":"2026-04-01","verified":"一次資料確認済み"},{"id":"K014","category":"登録・業務管理","topic":"契約締結時書面","question":"管理受託契約が成立した直後の法定対応として正しいものはどれか。","choices":[{"text":"契約前説明書を交付していれば締結時書面は常に不要である。","ok":false},{"text":"締結時書面は入居者だけに交付する。","ok":false},{"text":"契約内容を記載した締結時書面を遅滞なく交付する。","ok":true},{"text":"締結時書面は5年以内に渡せばよい。","ok":false}],"explanation":"締結前の重要事項説明書と、成立後の契約締結時書面は別の義務。","source":"https://www.mlit.go.jp/tochi_fudousan_kensetsugyo/pm_portal/administrator_duties.html","sourceName":"国交省：管理業者の業務","basisDate":"2026-04-01","verified":"一次資料確認済み"},{"id":"K015","category":"登録・業務管理","topic":"財産の分別","question":"管理業者が扱う家賃等の分別管理について正しいものはどれか。","choices":[{"text":"管理業者自身の固有財産と区分して管理する必要がある。","ok":true},{"text":"自己の運転資金として自由に混用できる。","ok":false},{"text":"現金で保管すれば帳簿等による識別は一切不要である。","ok":false},{"text":"所有者が異なっても契約ごとの識別は不要である。","ok":false}],"explanation":"家賃・敷金等は固有財産と区別し、管理受託契約ごとの金銭を識別可能にする。","source":"https://www.mlit.go.jp/tochi_fudousan_kensetsugyo/pm_portal/administrator_duties.html","sourceName":"国交省：管理業者の業務","basisDate":"2026-04-01","verified":"一次資料確認済み"},{"id":"K016","category":"登録・業務管理","topic":"帳簿管理","question":"家賃等の金銭管理に関する説明で正しいものはどれか。","choices":[{"text":"資金の帰属確認は会計年度末だけ行えば必ず足りる。","ok":false},{"text":"どの管理受託契約の金銭か帳簿・会計ソフト等で判別できるようにする。","ok":true},{"text":"金銭を一つの口座に集めれば契約別の記録は不要である。","ok":false},{"text":"契約番号の管理は法により禁止されている。","ok":false}],"explanation":"物件・契約ごとに受領金銭の帰属を識別できる管理が求められる。","source":"https://www.mlit.go.jp/tochi_fudousan_kensetsugyo/pm_portal/administrator_duties.html","sourceName":"国交省：管理業者の業務","basisDate":"2026-04-01","verified":"一次資料確認済み"},{"id":"K017","category":"登録・業務管理","topic":"定期報告","question":"管理業者から委託者への業務状況報告について正しいものはどれか。","choices":[{"text":"10年に1回だけ報告すればよい。","ok":false},{"text":"賃貸人に対する定期報告の義務は一切ない。","ok":false},{"text":"原則として少なくとも年1回は定期報告する。","ok":true},{"text":"5年に1回で必ず足りる。","ok":false}],"explanation":"管理業務の実施状況など、原則年1回以上の頻度で報告する。","source":"https://www.mlit.go.jp/tochi_fudousan_kensetsugyo/pm_portal/administrator_duties.html","sourceName":"国交省：管理業者の業務","basisDate":"2026-04-01","verified":"一次資料確認済み"},{"id":"K018","category":"登録・業務管理","topic":"報告内容","question":"管理受託契約に基づく定期報告の項目として適切なものはどれか。","choices":[{"text":"業務管理者の私的な年間収入。","ok":false},{"text":"入居者の趣味嗜好を独自に調査した結果。","ok":false},{"text":"他社の営業秘密を必ず報告する。","ok":false},{"text":"家賃等の収受状況や苦情の発生・対応状況。","ok":true}],"explanation":"維持保全の実施状況、家賃等の収受状況、苦情の発生・対応状況などを報告。","source":"https://www.mlit.go.jp/tochi_fudousan_kensetsugyo/pm_portal/administrator_duties.html","sourceName":"国交省：管理業者の業務","basisDate":"2026-04-01","verified":"一次資料確認済み"},{"id":"K019","category":"登録・業務管理","topic":"証明書","question":"賃貸住宅管理業に従事する者の証明書について正しいものはどれか。","choices":[{"text":"管理業務に従事する従業者には、原則として従業者証明書を携帯させる。","ok":true},{"text":"証明書の携帯は一律に禁止されている。","ok":false},{"text":"従業者は個人の運転免許証を見せれば法定証明書の代わりとなる。","ok":false},{"text":"名刺を持っていれば法律上の証明書は絶対に不要となる。","ok":false}],"explanation":"賃貸住宅管理業に従事する者は所定の従業者証明書を携帯する。内部事務のみの者など取扱いに注意。","source":"https://www.mlit.go.jp/tochi_fudousan_kensetsugyo/pm_portal/administrator_duties.html","sourceName":"国交省：管理業者の業務","basisDate":"2026-04-01","verified":"一次資料確認済み"},{"id":"K020","category":"登録・業務管理","topic":"帳簿","question":"賃貸住宅管理業者の帳簿について正しいものはどれか。","choices":[{"text":"帳簿に管理受託契約の内容は記載できない。","ok":false},{"text":"営業所または事務所ごとに備え付ける。","ok":true},{"text":"本店にだけ1冊あれば必ず足りる。","ok":false},{"text":"賃貸人の自宅ごとに必ず備える。","ok":false}],"explanation":"営業所・事務所ごとに、管理受託契約についての所定事項を記録する。","source":"https://www.mlit.go.jp/tochi_fudousan_kensetsugyo/pm_portal/administrator_duties.html","sourceName":"国交省：管理業者の業務","basisDate":"2026-04-01","verified":"一次資料確認済み"},{"id":"K021","category":"登録・業務管理","topic":"帳簿保存","question":"管理受託契約に関する帳簿の保存期間として正しいものはどれか。","choices":[{"text":"1か月間だけ保存すればよい。","ok":false},{"text":"一律に30年間保存する。","ok":false},{"text":"事業年度の末日から5年間保存する。","ok":true},{"text":"作成した当日だけ保存すればよい。","ok":false}],"explanation":"帳簿の保存は各事業年度の末日から5年間。","source":"https://www.cbr.mlit.go.jp/kensei/info/license/pdf/faq_a.pdf","sourceName":"国交省：FAQ抜粋","basisDate":"2026-04-01","verified":"一次資料確認済み"},{"id":"K022","category":"登録・業務管理","topic":"標識","question":"登録を受けた賃貸住宅管理業者の標識について正しいものはどれか。","choices":[{"text":"本店のみで一切足りる。","ok":false},{"text":"車両のダッシュボードだけに掲示する。","ok":false},{"text":"営業所には掲示してはならない。","ok":false},{"text":"営業所または事務所ごとの公衆の見やすい場所に掲示する。","ok":true}],"explanation":"標識は営業所・事務所単位で掲示する。","source":"https://www.mlit.go.jp/tochi_fudousan_kensetsugyo/pm_portal/administrator_duties.html","sourceName":"国交省：管理業者の業務","basisDate":"2026-04-01","verified":"一次資料確認済み"},{"id":"K023","category":"登録・業務管理","topic":"全部再委託","question":"受託した賃貸住宅管理業務の再委託について正しいものはどれか。","choices":[{"text":"管理業務の全部を他者へ再委託することは禁止される。","ok":true},{"text":"全部再委託は必ず義務付けられる。","ok":false},{"text":"すべての業務を外注し管理業者自身は何もしなくてもよい。","ok":false},{"text":"再委託について法律の規定は存在しない。","ok":false}],"explanation":"管理受託した業務の全部の再委託は禁止。","source":"https://www.hkd.mlit.go.jp/ky/jg/kensan/slo5pa000000x3wf-att/slo5pa000000x469.pdf","sourceName":"国交省：再委託の解説","basisDate":"2026-04-01","verified":"一次資料確認済み"},{"id":"K024","category":"登録・業務管理","topic":"一部再委託","question":"賃貸住宅管理業務の一部再委託について正しいものはどれか。","choices":[{"text":"一部再委託すると登録は必ず即時失効する。","ok":false},{"text":"管理受託契約に定めがあり、自ら再委託先を指導・監督するなどの条件の下で可能である。","ok":true},{"text":"一部の再委託も常に刑事罰の対象となる。","ok":false},{"text":"一部再委託は書面での取決めに一切関係なく無制限に可能である。","ok":false}],"explanation":"全部再委託は禁止。一部再委託は契約内容と管理業者の指導監督を踏まえた取扱いが可能。","source":"https://www.hkd.mlit.go.jp/ky/jg/kensan/slo5pa000000x3wf-att/slo5pa000000x469.pdf","sourceName":"国交省：再委託の解説","basisDate":"2026-04-01","verified":"一次資料確認済み"},{"id":"K025","category":"サブリース","topic":"契約の構造","question":"マスターリース契約の基本的な当事者関係として正しいものはどれか。","choices":[{"text":"管理会社が入居者へ売買代金を払う契約。","ok":false},{"text":"サブリース業者が消防署と設備点検を契約すること。","ok":false},{"text":"建物所有者がサブリース業者に賃貸する契約。","ok":true},{"text":"入居者が建物所有者から所有権を購入する契約。","ok":false}],"explanation":"マスターリースはオーナーからサブリース業者への貸付け。","source":"https://www.mlit.go.jp/tochi_fudousan_kensetsugyo/pm_portal/sublease.html","sourceName":"国交省：サブリース規制","basisDate":"2026-04-01","verified":"一次資料確認済み"},{"id":"K026","category":"サブリース","topic":"転貸借","question":"サブリースで入居者が賃貸住宅を借りる契約について正しいものはどれか。","choices":[{"text":"オーナーが金融機関から住宅ローンを借りる契約である。","ok":false},{"text":"所有者から建設会社への工事請負契約である。","ok":false},{"text":"管理者が国に登録申請する契約である。","ok":false},{"text":"一般にサブリース業者から入居者への転貸借契約である。","ok":true}],"explanation":"オーナー→サブリース業者がマスターリース、業者→入居者が転貸借。","source":"https://www.mlit.go.jp/tochi_fudousan_kensetsugyo/pm_portal/sublease.html","sourceName":"国交省：サブリース規制","basisDate":"2026-04-01","verified":"一次資料確認済み"},{"id":"K027","category":"サブリース","topic":"誇大広告","question":"特定賃貸借契約についての広告規制で正しいものはどれか。","choices":[{"text":"実際と著しく異なる条件や誤認させるような表示は禁止される。","ok":true},{"text":"インターネット広告だけは誇大表示が自由である。","ok":false},{"text":"広告では必ず家賃が将来増額すると表示する。","ok":false},{"text":"契約条件が変わる可能性を伏せることが義務である。","ok":false}],"explanation":"サブリース事業者等には誇大広告の禁止がある（法28条）。","source":"https://www.mlit.go.jp/tochi_fudousan_kensetsugyo/pm_portal/sublease.html","sourceName":"国交省：サブリース規制・法28条","basisDate":"2026-04-01","verified":"一次資料確認済み"},{"id":"K028","category":"サブリース","topic":"不当勧誘","question":"サブリース契約の勧誘について正しいものはどれか。","choices":[{"text":"虚偽説明でもオーナーに損害がなければ常に適法である。","ok":false},{"text":"契約解除の妨害は法律上無制限に許される。","ok":false},{"text":"相手の判断をゆがめるような不正確な情報や強引な勧誘は禁止される。","ok":true},{"text":"契約に影響する不利な事実は必ず隠さなければならない。","ok":false}],"explanation":"不当勧誘等は法29条で禁止される。","source":"https://www.mlit.go.jp/tochi_fudousan_kensetsugyo/pm_portal/sublease.html","sourceName":"国交省：サブリース規制・法29条","basisDate":"2026-04-01","verified":"一次資料確認済み"},{"id":"K029","category":"サブリース","topic":"勧誘者","question":"サブリース契約を勧誘する者への規制について正しいものはどれか。","choices":[{"text":"規制は物件の入居者にだけ適用される。","ok":false},{"text":"建設会社などが勧誘に関与しても一切規制されない。","ok":false},{"text":"サブリース業者以外の勧誘はすべて規制対象外である。","ok":false},{"text":"サブリース業者のほか、勧誘者も不当勧誘規制の対象となり得る。","ok":true}],"explanation":"サブリース業者と勧誘者が対象。建設業者等の勧誘も該当し得る。","source":"https://www.mlit.go.jp/tochi_fudousan_kensetsugyo/pm_portal/sublease.html","sourceName":"国交省：サブリース規制","basisDate":"2026-04-01","verified":"一次資料確認済み"},{"id":"K030","category":"サブリース","topic":"説明前置","question":"特定賃貸借契約（マスターリース）の締結に際して必要な説明として正しいものはどれか。","choices":[{"text":"契約前にオーナーとなる者へ重要事項の書面を交付し、説明する。","ok":true},{"text":"契約後1年以内であれば説明を省略できる。","ok":false},{"text":"契約内容の説明をする相手は入居者だけである。","ok":false},{"text":"管理会社の営業用パンフレットがあれば、説明義務は必ず消える。","ok":false}],"explanation":"特定賃貸借契約では法30条の重要事項説明・書面交付が必要。","source":"https://www.mlit.go.jp/tochi_fudousan_kensetsugyo/pm_portal/sublease.html","sourceName":"国交省：サブリース規制・法30条","basisDate":"2026-04-01","verified":"一次資料確認済み"},{"id":"K031","category":"サブリース","topic":"説明者","question":"特定賃貸借契約の重要事項説明者について正しいものはどれか。","choices":[{"text":"借主本人がオーナーの立場で説明しなければならない。","ok":false},{"text":"法令上の特定資格の限定はないが、専門知識のある者が説明することが望ましい。","ok":true},{"text":"必ず公認会計士でなければならない。","ok":false},{"text":"必ず宅建士でなければならないと法30条にある。","ok":false}],"explanation":"説明者について特定資格の法律上の限定はなく、知識・経験を持つ者による説明が望ましい。","source":"https://www.mlit.go.jp/tochi_fudousan_kensetsugyo/pm_portal/sublease.html","sourceName":"国交省：サブリース規制","basisDate":"2026-04-01","verified":"一次資料確認済み"},{"id":"K032","category":"サブリース","topic":"締結時書面","question":"マスターリース契約の締結時に関して正しいものはどれか。","choices":[{"text":"契約時書面に賃料を記載してはならない。","ok":false},{"text":"契約時の書面は国が交付し、業者には義務がない。","ok":false},{"text":"契約期間や賃料など所定事項を書いた書面を交付する義務がある。","ok":true},{"text":"契約時書面の交付は常に禁止される。","ok":false}],"explanation":"サブリース事業者は法31条の契約時書面を交付する。","source":"https://www.mlit.go.jp/tochi_fudousan_kensetsugyo/pm_portal/sublease.html","sourceName":"国交省：サブリース規制・法31条","basisDate":"2026-04-01","verified":"一次資料確認済み"},{"id":"K033","category":"サブリース","topic":"書類閲覧","question":"特定転貸事業者の書類閲覧に関する説明で正しいものはどれか。","choices":[{"text":"業務・財産関係の書類は法令上すべて備置きが禁止される。","ok":false},{"text":"閲覧は会社の株主以外に一切認められない。","ok":false},{"text":"管理する住宅の入居者全員に個人の銀行口座を公開する義務がある。","ok":false},{"text":"事業・財産状況の書類を備え置き、契約相手方等の請求に応じて閲覧させる義務がある。","ok":true}],"explanation":"法32条は特定転貸事業者の業務・財産状況書類の備置きと閲覧を規定。","source":"https://www.mlit.go.jp/tochi_fudousan_kensetsugyo/pm_portal/sublease.html","sourceName":"国交省：サブリース規制・法32条","basisDate":"2026-04-01","verified":"一次資料確認済み"},{"id":"K034","category":"サブリース","topic":"登録とサブリース","question":"サブリース規制と管理業登録について正しいものはどれか。","choices":[{"text":"管理業の登録がなくても、特定転貸事業者に対する法定規制は適用され得る。","ok":true},{"text":"管理業登録がない事業者の誇大広告は常に自由である。","ok":false},{"text":"管理業登録がないとマスターリース契約は民法上必ず無効になる。","ok":false},{"text":"管理業登録の有無で特定転貸事業者の概念は自動的に消滅する。","ok":false}],"explanation":"特定転貸事業者・勧誘者への規制は管理業登録と独立して適用される。","source":"https://www.ktr.mlit.go.jp/kensan/index00000029.html","sourceName":"国交省関東地方整備局：FAQ","basisDate":"2026-04-01","verified":"一次資料確認済み"},{"id":"K035","category":"サブリース","topic":"説明期間","question":"特定賃貸借契約の重要事項説明のタイミングに関する説明で正しいものはどれか。","choices":[{"text":"説明をする前に必ず契約を成立させる必要がある。","ok":false},{"text":"契約判断のため、説明から締結まで1週間程度の期間を置くことが望ましい。","ok":true},{"text":"すべての契約で法律上180日以上の間隔が義務である。","ok":false},{"text":"契約前説明の翌日以降に締結すると必ず違法となる。","ok":false}],"explanation":"説明から締結まで1週間程度を設けることが望ましいという行政上の考え方。","source":"https://www.mlit.go.jp/tochi_fudousan_kensetsugyo/pm_portal/sublease.html","sourceName":"国交省：サブリース規制","basisDate":"2026-04-01","verified":"一次資料確認済み"},{"id":"K036","category":"原状回復・契約実務","topic":"通常損耗","question":"賃貸住宅の原状回復に関する原則として正しいものはどれか。","choices":[{"text":"建物が古くなること自体が常に借主の過失である。","ok":false},{"text":"入居時より新しくする費用は必ず借主に請求できる。","ok":false},{"text":"通常の使用による損耗や経年変化は、原則として賃借人の原状回復義務に含まれない。","ok":true},{"text":"通常損耗は例外なくすべて借主が新品交換する。","ok":false}],"explanation":"通常損耗・経年変化は賃料の対価に含まれると考える。","source":"https://www.mlit.go.jp/jutakukentiku/house/jutakukentiku_house_tk3_000020.html","sourceName":"国交省：原状回復ガイドライン","basisDate":"2026-04-01","verified":"一次資料確認済み"},{"id":"K037","category":"原状回復・契約実務","topic":"故意過失","question":"借主の不注意で壁を損傷させた場合の原状回復について正しいものはどれか。","choices":[{"text":"借主が故意に壁を壊しても常に貸主だけが負担する。","ok":false},{"text":"すべての損傷は管理会社が無条件で負担する。","ok":false},{"text":"借主の故意・過失による損傷は原状回復と無関係である。","ok":false},{"text":"故意・過失や通常を超える使用による損傷は借主負担となり得る。","ok":true}],"explanation":"通常の使用を超える故意・過失等による損耗の復旧が原状回復の対象。","source":"https://www.mlit.go.jp/jutakukentiku/house/jutakukentiku_house_tk3_000020.html","sourceName":"国交省：原状回復ガイドライン","basisDate":"2026-04-01","verified":"一次資料確認済み"},{"id":"K038","category":"原状回復・契約実務","topic":"経過年数","question":"原状回復費用の算定に関する考え方として正しいものはどれか。","choices":[{"text":"修繕対象の種類によっては経過年数を考慮して負担割合を計算する。","ok":true},{"text":"すべての設備は築年数に関係なく新品価格を借主が負担する。","ok":false},{"text":"経過年数は法律上必ず100年間無視する。","ok":false},{"text":"経過年数の考慮は原状回復ガイドラインで一切触れられていない。","ok":false}],"explanation":"部材・設備に応じ、経過年数の考慮や部分補修など適切な算定方法を使う。","source":"https://www.mlit.go.jp/jutakukentiku/house/jutakukentiku_house_tk3_000020.html","sourceName":"国交省：原状回復ガイドライン","basisDate":"2026-04-01","verified":"一次資料確認済み"},{"id":"K039","category":"原状回復・契約実務","topic":"入退去確認","question":"原状回復をめぐる紛争予防策として適切なものはどれか。","choices":[{"text":"退去後に全ての傷の原因を推測するだけで証拠として必ず十分である。","ok":false},{"text":"入居時と退去時に物件状況を確認し、写真やチェックリストに残す。","ok":true},{"text":"入居時の傷を記録しないことが必須である。","ok":false},{"text":"貸主と借主の確認作業は法律で禁止される。","ok":false}],"explanation":"入退去時の記録は、損傷の発生時期や原因についての争いを減らす。","source":"https://www.mlit.go.jp/jutakukentiku/house/jutakukentiku_house_tk3_000024.html","sourceName":"国交省：原状回復Q&A","basisDate":"2026-04-01","verified":"一次資料確認済み"},{"id":"K040","category":"原状回復・契約実務","topic":"クリーニング特約","question":"退去時清掃費用の特約について正しいものはどれか。","choices":[{"text":"クリーニング特約は例外なくすべて無効である。","ok":false},{"text":"金額や範囲が不明な特約ほど必ず有効になる。","ok":false},{"text":"内容の明確さや費用の妥当性等によって有効性を判断する。","ok":true},{"text":"クリーニング特約は書けば常に全額有効である。","ok":false}],"explanation":"特約の有効性は具体的な負担範囲・説明・費用の妥当性などを考慮する。","source":"https://www.mlit.go.jp/jutakukentiku/house/jutakukentiku_house_tk3_000024.html","sourceName":"国交省：原状回復Q&A","basisDate":"2026-04-01","verified":"一次資料確認済み"},{"id":"K041","category":"原状回復・契約実務","topic":"原状回復の意味","question":"「原状回復」の意味について正しいものはどれか。","choices":[{"text":"退去時には必ずすべての設備を新品にする意味である。","ok":false},{"text":"借主の故意による損傷も一切対象外である。","ok":false},{"text":"原状回復は家賃の増額のみを意味する。","ok":false},{"text":"入居当初の新品状態に戻すことと常に同じではない。","ok":true}],"explanation":"通常損耗まで新品交換する制度ではなく、故意・過失等による損傷の復旧が中心。","source":"https://www.mlit.go.jp/jutakukentiku/house/jutakukentiku_house_tk3_000020.html","sourceName":"国交省：原状回復ガイドライン","basisDate":"2026-04-01","verified":"一次資料確認済み"},{"id":"K042","category":"原状回復・契約実務","topic":"特約の理解","question":"通常の原状回復義務を超える特約の取扱いとして適切なものはどれか。","choices":[{"text":"必要性や合理性、借主の認識・意思表示などが重要となる。","ok":true},{"text":"特約は貸主が一方的に紙へ書くだけで常に有効となる。","ok":false},{"text":"特約は契約書に何もなくても必ず借主に無制限の費用負担を生む。","ok":false},{"text":"合理性の検討は国交省ガイドラインで否定されている。","ok":false}],"explanation":"通常の負担を超える特約は合理性や明確な合意が重要。","source":"https://www.mlit.go.jp/jutakukentiku/house/jutakukentiku_house_tk3_000024.html","sourceName":"国交省：原状回復Q&A","basisDate":"2026-04-01","verified":"一次資料確認済み"},{"id":"K043","category":"原状回復・契約実務","topic":"水垢放置","question":"浴室の清掃を長期間怠り、水垢やカビを拡大させた場合の基本的な考え方はどれか。","choices":[{"text":"水回りは何が起きても借主に注意義務はない。","ok":false},{"text":"借主の手入れ不足として、通常損耗を超える部分が借主負担となり得る。","ok":true},{"text":"使用中の手入れ不足は原状回復に一切関係しない。","ok":false},{"text":"入居期間中に発生したカビはすべて必ず貸主負担である。","ok":false}],"explanation":"清掃・手入れを怠って発生・拡大した損傷は善管注意義務違反と判断され得る。","source":"https://www.mlit.go.jp/jutakukentiku/house/jutakukentiku_house_tk3_000020.html","sourceName":"国交省：原状回復ガイドライン","basisDate":"2026-04-01","verified":"一次資料確認済み"},{"id":"K044","category":"原状回復・契約実務","topic":"設備設置","question":"DIY型賃貸借の契約上の留意点として適切なものはどれか。","choices":[{"text":"改修工事の内容は契約上すべて不明にしておくべきである。","ok":false},{"text":"DIY型賃貸借では退去時の取扱いを決めることが禁止される。","ok":false},{"text":"工事内容と退去時の原状回復の有無等を貸主借主で明確に合意する。","ok":true},{"text":"借主は貸主に知らせず構造躯体を自由に変更できる。","ok":false}],"explanation":"DIY型賃貸借では改修範囲・合意・返還時の取扱いを明確にする。","source":"https://www.mlit.go.jp/jutakukentiku/house/jutakukentiku_house_tk3_000046.html","sourceName":"国交省：DIY型賃貸借","basisDate":"2026-04-01","verified":"一次資料確認済み"},{"id":"K045","category":"原状回復・契約実務","topic":"貸主指定施工","question":"原状回復工事の実施者について、契約内容の確認が必要な理由として正しいものはどれか。","choices":[{"text":"どんな契約でも借主は無条件で自由に施工者を決められる。","ok":false},{"text":"契約の工事実施方法は民法上必ず無効である。","ok":false},{"text":"施工者の合意は一切トラブルと関係しない。","ok":false},{"text":"契約で貸主指定業者による施工と定めている場合、借主が勝手に別業者へ頼めない場合がある。","ok":true}],"explanation":"誰が工事するかは契約条項によって異なり、国交省Q&Aも確認を求めている。","source":"https://www.mlit.go.jp/jutakukentiku/house/jutakukentiku_house_tk3_000024.html","sourceName":"国交省：原状回復Q&A","basisDate":"2026-04-01","verified":"一次資料確認済み"},{"id":"K046","category":"建物・設備・実務","topic":"報告対象","question":"国が全国一律で建築基準法上の定期報告対象に指定するものとして適切なものはどれか。","choices":[{"text":"入居者の個人用自転車。","ok":false},{"text":"一定のエレベーター等の昇降機。","ok":true},{"text":"全国のすべての私有の机。","ok":false},{"text":"あらゆる住宅の家庭用テレビ。","ok":false}],"explanation":"昇降機のほか、一定の不特定多数利用施設などが対象。個別の報告対象は建物条件等で異なる。","source":"https://www.mlit.go.jp/jutakukentiku/build/jutakukentiku_house_tk_000039.html","sourceName":"国交省：建築基準法定期報告","basisDate":"2026-04-01","verified":"一次資料確認済み"},{"id":"K047","category":"建物・設備・実務","topic":"対象建物","question":"建築基準法上の定期報告の対象建築物について正しいものはどれか。","choices":[{"text":"特定行政庁には報告対象を指定する権限が一切ない。","ok":false},{"text":"建築物の用途は定期報告に全く関係しない。","ok":false},{"text":"地域の事情に応じて特定行政庁が対象を定める場合もある。","ok":true},{"text":"報告対象はすべての自治体で完全に同じである。","ok":false}],"explanation":"全国一律の対象に加え、特定行政庁が地域事情に応じて指定できる。","source":"https://www.mlit.go.jp/jutakukentiku/build/jutakukentiku_house_tk_000039.html","sourceName":"国交省：建築基準法定期報告","basisDate":"2026-04-01","verified":"一次資料確認済み"},{"id":"K048","category":"建物・設備・実務","topic":"調査資格","question":"建築基準法上の法定定期調査・検査について正しいものはどれか。","choices":[{"text":"入居者なら資格なく法定調査を代行できる。","ok":false},{"text":"管理会社の名刺があれば法律上の資格要件を当然に満たす。","ok":false},{"text":"建築物の法定調査には担当者の資格が全く関係しない。","ok":false},{"text":"所定の資格者が行う必要がある。","ok":true}],"explanation":"法定の定期調査・検査には関係法令で定める資格者が必要。","source":"https://www.mlit.go.jp/jutakukentiku/build/jutakukentiku_house_tk_000039.html","sourceName":"国交省：建築基準法定期報告","basisDate":"2026-04-01","verified":"一次資料確認済み"},{"id":"K049","category":"建物・設備・実務","topic":"報告先","question":"建築基準法12条の定期報告の一般的な報告先について正しいものはどれか。","choices":[{"text":"特定行政庁。","ok":true},{"text":"必ず契約した家財保険会社。","ok":false},{"text":"住宅ローンを借りた銀行。","ok":false},{"text":"入居者の勤務先企業。","ok":false}],"explanation":"定期調査・検査の結果は特定行政庁へ報告する制度。","source":"https://www.mlit.go.jp/jutakukentiku/build/jutakukentiku_house_tk_000160.html","sourceName":"国交省：建築基準法定期報告","basisDate":"2026-04-01","verified":"一次資料確認済み"},{"id":"K050","category":"建物・設備・実務","topic":"オンライン申請","question":"建築基準法上の定期報告の提出方法について正しいものはどれか。","choices":[{"text":"すべての自治体でSNSの個人メッセージだけで正式提出できる。","ok":false},{"text":"条件を満たせばオンラインで報告することも可能である。","ok":true},{"text":"電子的な提出は法律上絶対に禁止される。","ok":false},{"text":"提出には必ず入居者全員の自筆署名が必要である。","ok":false}],"explanation":"制度上はオンライン活用が可能。実際の受付方法は行政庁の運用を確認する。","source":"https://www.mlit.go.jp/jutakukentiku/build/jutakukentiku_house_tk_000160.html","sourceName":"国交省：オンラインを活用した定期報告","basisDate":"2026-04-01","verified":"一次資料確認済み"}];</script><script>(()=>{'use strict';
const KEY='chintai-drill-v1';const CATS=['登録・業務管理','サブリース','原状回復・契約実務','建物・設備・実務'];
const app=document.getElementById('app');let all=[];let record={answers:{},starred:[],sessions:[]};let mode=null;let current=[];let at=0;let selected=null;let timer=null;let expiresAt=0;
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function load(){try{let r=JSON.parse(localStorage.getItem(KEY)||'{}');if(r&&typeof r==='object'&&r.answers&&r.starred&&r.sessions){record={answers:r.answers,starred:r.starred,sessions:r.sessions}}}catch(e){console.warn('bad saved data',e)}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(record))}catch(e){alert('端末に記録を保存できません。ブラウザのストレージ設定を確認してください。')}}
const shuffled=(arr)=>{let a=[...arr];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const ids=()=>all.map(q=>q.id);
const entry=id=>record.answers[id]||{attempts:0,correct:0,lastOk:null};
const studied=()=>all.filter(q=>entry(q.id).attempts>0).length;
const answered=()=>Object.values(record.answers).reduce((a,e)=>a+(e.attempts||0),0);
const rights=()=>Object.values(record.answers).reduce((a,e)=>a+(e.correct||0),0);
const pct=(x,y)=>y?Math.round(x/y*100):0;
const wrongids=()=>all.filter(q=>entry(q.id).attempts>0&&entry(q.id).lastOk===false).map(q=>q.id);
const starids=()=>all.filter(q=>record.starred.includes(q.id)).map(q=>q.id);
const makeProgress=v=>`<div class="progressbar" role="progressbar" aria-valuenow="${v}" aria-valuemin="0" aria-valuemax="100"><span style="width:${Math.max(0,Math.min(100,v))}%"><\/span><\/div>`;
function setPage(html,where='home'){clearTimer();app.innerHTML=html;document.querySelectorAll('[data-nav]').forEach(n=>n.classList.toggle('active',n.dataset.nav===where));window.scrollTo({top:0,behavior:'instant'});}
function clearTimer(){if(timer){clearInterval(timer);timer=null}}
function go(page){location.hash=page==='home'?'#home':'#'+page;renderHash()}
function renderHash(){let p=location.hash.slice(1);if(p==='about')about();else if(p==='stats')stats();else if(p==='review')review();else home()}
function home(){const done=studied();setPage(`<section class="hero"><div class="hero-main"><div class="eyebrow">SELF-STUDY / 2026<\/div><h1>覚えるより、<br><em>解いて理解する。<\/em><\/h1><p>賃貸不動産経営管理士に向けた、根拠つきオリジナル4択問題。間違えたところからもう一度。<\/p><div class="hero-actions"><button class="btn btn-primary" id="startAll">今すぐ10問解く →<\/button><button class="btn btn-outline" id="mockStart">50問模擬試験<\/button><\/div><div class="mini-note" style="color:#c4d9dc">法令基準：2026年4月1日 ／ 本試験の公式問題ではありません<\/div><\/div><div class="hero-side"><div class="surface"><div class="stat-label">学習した問題<\/div><div class="stat-num">${done}<small style="font-size:16px;color:var(--sub)"> / ${all.length}<\/small><\/div>${makeProgress(pct(done,all.length))}<p class="mini-note">まだ解いていない問題も含めて出題<\/p><\/div><div class="surface"><div class="stat-label">累計の正答率<\/div><div class="stat-num">${answered()?pct(rights(),answered())+'%':'—'}<\/div><p class="mini-note">${answered()}回の解答から集計<\/p><\/div><\/div><\/section><div class="kpis"><div class="surface kpi"><strong>${wrongids().length}<\/strong><small>要復習<\/small><\/div><div class="surface kpi"><strong>${starids().length}<\/strong><small>ブックマーク<\/small><\/div><div class="surface kpi"><strong>${record.sessions.length}<\/strong><small>演習回数<\/small><\/div><\/div><div class="section-head"><div><div class="eyebrow">PRACTICE<\/div><h2>分野別に学ぶ<\/h2><\/div><span class="small">全${all.length}問<\/span><\/div><div class="card-grid">${CATS.map((cat,i)=>{const qs=all.filter(q=>q.category===cat),count=qs.filter(q=>entry(q.id).attempts>0).length;return `<button class="study-card" data-category="${esc(cat)}"><span class="num">0${i+1} / ${qs.length} QUESTIONS<\/span><h3>${esc(cat)} <span class="right">↗<\/span><\/h3><p>学習済み ${count} / ${qs.length}問<\/p>${makeProgress(pct(count,qs.length))}<\/button>`}).join('')}<\/div><div class="section-head"><h2>苦手をつぶす<\/h2><\/div><div class="card-grid"><button class="study-card" id="wrongStart"><span class="num">REVIEW<\/span><h3>間違えた問題 ↗<\/h3><p>${wrongids().length}問を復習する<\/p><\/button><button class="study-card" id="starStart"><span class="num">FAVORITES<\/span><h3>保存した問題 ↗<\/h3><p>${starids().length}問を復習する<\/p><\/button><\/div><div class="alert" style="margin-top:22px">本サイトは独立した学習用教材です。問題はオリジナルで、過去問そのものではありません。法令・実務の最新情報は根拠リンク等で確認してください。<\/div>`);
app.querySelector('#startAll').onclick=()=>start('quick',shuffled(ids()).slice(0,10));app.querySelector('#mockStart').onclick=()=>start('mock',shuffled(ids()));app.querySelectorAll('[data-category]').forEach(b=>b.onclick=()=>start('category',shuffled(all.filter(x=>x.category===b.dataset.category).map(x=>x.id)),b.dataset.category));app.querySelector('#wrongStart').onclick=()=>start('wrong',shuffled(wrongids()));app.querySelector('#starStart').onclick=()=>start('star',shuffled(starids()));}
function start(type,items,label=''){if(!items.length){setPage(`<div class="surface nos"><h2>対象の問題はまだありません<\/h2><p>問題を解いたりブックマークを付けると、ここでまとめて復習できます。<\/p><button class="btn btn-dark" id="backHome">ホームに戻る<\/button><\/div>`,'review');app.querySelector('#backHome').onclick=()=>go('home');return} mode={type,label,started:Date.now(),results:[],originalIds:items.slice()};current=items.map(id=>({question:all.find(q=>q.id===id),order:shuffled([0,1,2,3])}));at=0;selected=null;if(type==='mock'){expiresAt=Date.now()+120*60000;timer=setInterval(tick,1000)}showQuestion();}
function fmt(ms){const t=Math.max(0,Math.ceil(ms/1000));return `${Math.floor(t/60).toString().padStart(2,'0')}:${(t%60).toString().padStart(2,'0')}`}
function tick(){let t=document.querySelector('#timer');if(t)t.textContent='残り '+fmt(expiresAt-Date.now());if(mode?.type==='mock'&&Date.now()>=expiresAt){finish()}}
function showQuestion(){selected=null;const data=current[at];const q=data.question;const progress=pct(at,current.length);const isStar=record.starred.includes(q.id);const timerHtml=mode.type==='mock'?`<span id="timer" class="filter-chip">残り ${fmt(expiresAt-Date.now())}<\/span>`:'';
setQuestionHtml(`<div class="question-wrap"><div class="q-top"><button class="back" id="stop">← 演習を終了<\/button>${timerHtml}<span class="small">${at+1} / ${current.length}問<\/span><\/div>${makeProgress(progress)}<div class="q-card" style="margin-top:17px"><div class="q-meta"><span class="q-number">QUESTION ${String(at+1).padStart(2,'0')}<\/span><span class="pill">${esc(q.category)}<\/span><span class="pill muted-pill">${esc(q.topic)}<\/span><\/div><h2 class="q-title">${esc(q.question)}<\/h2><div class="answers">${data.order.map((k,i)=>`<button class="choice" data-choice="${k}"><span class="mark">${i+1}<\/span><span>${esc(q.choices[k].text)}<\/span><\/button>`).join('')}<\/div><div id="explanation" aria-live="polite"><\/div><div class="q-actions"><button class="btn btn-ghost" id="star">${isStar?'★ 保存済み':'☆ ブックマーク'}<\/button><button class="btn btn-dark" id="next" disabled>${at===current.length-1?'結果を見る':'次の問題 →'}<\/button><\/div><\/div><p class="small" style="text-align:center;margin-top:16px">出題基準：2026年4月1日 ／ 法令・行政資料に基づく独自問題<\/p><\/div>`);
app.querySelector('#stop').onclick=()=>finish();app.querySelector('#star').onclick=()=>{let i=record.starred.indexOf(q.id);i>=0?record.starred.splice(i,1):record.starred.push(q.id);save();app.querySelector('#star').textContent=record.starred.includes(q.id)?'★ 保存済み':'☆ ブックマーク'};app.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>choose(Number(b.dataset.choice)));app.querySelector('#next').onclick=()=>{if(selected===null)return;if(at===current.length-1)finish();else{at++;showQuestion()}};if(mode.type==='mock')timer=setInterval(tick,1000);
}
function setQuestionHtml(html){clearTimer();app.innerHTML=html;document.querySelectorAll('[data-nav]').forEach(n=>n.classList.remove('active'));window.scrollTo({top:0,behavior:'instant'})}
function choose(k){if(selected!==null)return;selected=k;const q=current[at].question;const correct=q.choices[k].ok;const old=entry(q.id);record.answers[q.id]={attempts:old.attempts+1,correct:old.correct+(correct?1:0),lastOk:correct,lastAt:new Date().toISOString()};mode.results.push({id:q.id,ok:correct,choice:k});save();app.querySelectorAll('[data-choice]').forEach(b=>{b.disabled=true;const x=Number(b.dataset.choice);if(q.choices[x].ok)b.classList.add('correct');else if(x===k)b.classList.add('wrong');});const winner=q.choices.find(x=>x.ok);app.querySelector('#explanation').innerHTML=`<div class="answer-review ${correct?'':'is-wrong'}"><div class="result-label">${correct?'✓ 正解です':'× 不正解'}　正答：${esc(winner.text)}<\/div><p style="margin-bottom:8px">${esc(q.explanation)}<\/p><div class="small">【確認のポイント】正答以外の3つの選択肢は、対象・数字・手続・義務の内容が根拠資料と一致しません。<\/div><a class="source-link" href="${esc(q.source)}" target="_blank" rel="noopener noreferrer">根拠を確認：${esc(q.sourceName)} ↗<\/a><\/div>`;app.querySelector('#next').disabled=false;}
function finish(){if(!mode)return;clearTimer();const m=mode;mode=null;const r=m.results;record.sessions.push({type:m.type,label:m.label,at:new Date().toISOString(),count:r.length,correct:r.filter(x=>x.ok).length});record.sessions=record.sessions.slice(-250);save();setPage(`<section class="summary"><div class="summary-hero"><span class="eyebrow" style="color:#9de5ca">SESSION COMPLETE<\/span><h2>${r.filter(x=>x.ok).length} <small style="font-size:21px">/ ${r.length}問<\/small><\/h2><p>正答率 ${pct(r.filter(x=>x.ok).length,r.length)}%　${r.length<m.originalIds.length?'（途中終了）':''}<\/p><button class="btn btn-primary" id="again">もう一度演習<\/button><button class="btn btn-outline" id="home">ホームへ<\/button><\/div><div class="surface recap-list"><h2>今回の解答<\/h2>${r.length?r.map((item,i)=>{let q=all.find(x=>x.id===item.id);return `<div class="recap"><strong style="color:${item.ok?'var(--good)':'var(--red)'}">${item.ok?'○':'×'}　第${i+1}問　${esc(q.topic)}<\/strong><div class="small">${esc(q.question)}<\/div><small>根拠：<a href="${esc(q.source)}" target="_blank" rel="noopener noreferrer">${esc(q.sourceName)}<\/a><\/small><\/div>`}).join(''):'<p>まだ解答はありません。<\/p>'}<\/div><\/section>`,'stats');app.querySelector('#again').onclick=()=>start(m.type,shuffled(m.originalIds),m.label);app.querySelector('#home').onclick=()=>go('home');}
function review(){const wc=wrongids(),sc=starids();setPage(`<div class="section-head"><div><div class="eyebrow">PERSONAL REVIEW<\/div><h2>苦手を、得意に。<\/h2><\/div><\/div><div class="card-grid"><button class="study-card" id="wrong"><span class="num">WRONG ANSWERS<\/span><h3>間違えた問題　${wc.length}問<\/h3><p>最後の回答が不正解だった問題を解き直す<\/p><\/button><button class="study-card" id="favorite"><span class="num">BOOKMARKS<\/span><h3>ブックマーク　${sc.length}問<\/h3><p>あとでもう一度確認したい問題<\/p><\/button><\/div><div class="surface" style="margin-top:20px"><h3>復習のコツ<\/h3><p>解説の「根拠を確認」から国土交通省等の原資料を確認できます。答えを覚えるだけでなく、理由を説明できるようになるのが目標です。<\/p><\/div>`,'review');app.querySelector('#wrong').onclick=()=>start('wrong',shuffled(wc));app.querySelector('#favorite').onclick=()=>start('star',shuffled(sc));}
function stats(){let total=answered(),trueN=rights();setPage(`<div class="section-head"><div><div class="eyebrow">MY PROGRESS<\/div><h2>学習記録<\/h2><\/div><\/div><div class="stats-grid"><div class="surface"><span class="small">解答数<\/span><strong>${total}<\/strong><\/div><div class="surface"><span class="small">正答率<\/span><strong>${total?pct(trueN,total)+'%':'—'}<\/strong><\/div><div class="surface"><span class="small">学習済<\/span><strong>${studied()}<small style="font-size:12px">/${all.length}<\/small><\/strong><\/div><\/div><div class="category-stats">${CATS.map(c=>{let items=all.filter(q=>q.category===c),n=items.filter(q=>entry(q.id).attempts>0).length;return `<div class="cstat"><div class="row"><label>${esc(c)}<\/label><span class="small">${n}/${items.length}問<\/span><\/div>${makeProgress(pct(n,items.length))}<\/div>`}).join('')}<\/div><div class="surface"><h3>学習データを管理<\/h3><p class="small">学習記録は今使っている端末・ブラウザ内だけに保存されます。端末変更やブラウザのデータ削除に備えてバックアップしてください。<\/p><div class="settings-actions"><button class="btn btn-dark" id="export">記録を書き出す<\/button><label class="btn btn-ghost" for="import">記録を復元する<\/label><input type="file" id="import" accept=".json,application/json"><button class="btn btn-ghost" id="reset">履歴を消去<\/button><\/div><\/div>`,'stats');app.querySelector('#export').onclick=exportRecord;app.querySelector('#import').onchange=e=>{const f=e.target.files?.[0];if(f)importRecord(f)};app.querySelector('#reset').onclick=()=>{if(confirm('学習履歴・ブックマークをすべて削除します。元に戻せません。よろしいですか？')){record={answers:{},starred:[],sessions:[]};save();stats()}}}
function exportRecord(){const blob=new Blob([JSON.stringify({format:'chintai-drill-backup',version:1,exportedAt:new Date().toISOString(),record},null,2)],{type:'application/json'});const a=document.createElement('a');const url=URL.createObjectURL(blob);a.href=url;a.download='chintai-drill-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function importRecord(f){if(f.size>1000000){alert('ファイルが大きすぎます（上限1MB）。');return}const reader=new FileReader();reader.onload=()=>{try{let parsed=JSON.parse(String(reader.result));if(parsed.format!=='chintai-drill-backup'||parsed.version!==1||!parsed.record||!parsed.record.answers||!Array.isArray(parsed.record.starred)||!Array.isArray(parsed.record.sessions))throw Error('format');if(!confirm('現在の学習記録をバックアップの内容で上書きしますか？'))return;let clean={answers:{},starred:[],sessions:[]};for(const q of all){let x=parsed.record.answers[q.id];if(x&&Number.isInteger(x.attempts)&&x.attempts>=0&&Number.isInteger(x.correct)&&x.correct>=0&&x.correct<=x.attempts){clean.answers[q.id]={attempts:x.attempts,correct:x.correct,lastOk:typeof x.lastOk==='boolean'?x.lastOk:null,lastAt:typeof x.lastAt==='string'?x.lastAt:''}}}clean.starred=parsed.record.starred.filter(id=>typeof id==='string'&&all.some(q=>q.id===id));clean.sessions=parsed.record.sessions.filter(s=>s&&Number.isInteger(s.count)&&Number.isInteger(s.correct)).slice(-250);record=clean;save();alert('復元しました。');stats()}catch(e){alert('バックアップ形式を確認できませんでした。')}};reader.onerror=()=>alert('ファイルを読み取れませんでした。');reader.readAsText(f)}
function about(){const unique=[...new Map(all.map(q=>[q.source,{name:q.sourceName,url:q.source}])).values()];setPage(`<div class="about"><div class="eyebrow">ABOUT THIS PROJECT<\/div><h1 style="font-size:37px">この学習サイトについて<\/h1><div class="alert">独立した非公式の学習教材です。賃貸不動産経営管理士協議会や国土交通省の公式アプリではありません。掲載問題は公式過去問ではなく独自に作成したものです。<\/div><section class="surface"><h2>学習のルール<\/h2><ul><li>問題数：${all.length}問のオリジナル4択。<\/li><li>参照法令の基準日：2026年4月1日。<\/li><li>根拠は国土交通省などの一次資料にリンク。<\/li><li>問題文・選択肢は学習用に新たに作成。<\/li><li>本番の出題傾向・合格可能性を保証するものではありません。<\/li><li>学習記録は端末内にのみ保存。外部送信、アカウント登録、広告、追跡解析はなし。<\/li><\/ul><\/section><section class="surface"><h2>参照した公的資料<\/h2><p class="small">根拠を自分で確認することが、知識を定着させる近道です。<\/p><ol class="source-list">${unique.map(s=>`<li><a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.name)} ↗<\/a><\/li>`).join('')}<\/ol><\/section><section class="surface"><h2>利用時の注意点<\/h2><p>法令等の改正や個別事案の事情により結論が変わる可能性があります。正確性には注意していますが、誤りが全くないことを保証するものではありません。本番の判断では公式資料も参照してください。<\/p><p>問題の誤りを見つけた場合は、問題IDと疑問点を控えて報告してください。報告先の連絡窓口は今後設ける予定です。<\/p><\/section><button class="btn btn-dark" id="back">演習に戻る →<\/button><\/div>`,'about');app.querySelector('#back').onclick=()=>go('home');}
async function init(){load();try{let resp=new Response(JSON.stringify(window.__DRILL_QUESTIONS),{status:200});if(!resp.ok)throw Error('HTTP '+resp.status);all=await resp.json();if(all.length!==50)throw Error('問題数が不正です');renderHash();window.addEventListener('hashchange',()=>{if(mode){if(!confirm('演習を終了して移動しますか？'))return;mode=null;clearTimer()}renderHash()});document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{if(mode&&!confirm('演習を終了して移動しますか？'))return;mode=null;clearTimer();go(b.dataset.nav)});document.querySelector('#brand').onclick=e=>{if(mode&&!confirm('演習を終了して移動しますか？')){e.preventDefault();return}mode=null;clearTimer()};if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});}catch(e){console.error(e);app.innerHTML='<div class="surface nos"><h2>問題を読み込めませんでした<\/h2><p>ファイル一式をWebサーバーから開いてください。ページを再読込しても直らない場合は管理者にご連絡ください。<\/p><\/div>'}}
init();
})();
